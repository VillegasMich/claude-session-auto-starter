name: Release

# Manual, from main: bumps the version if Cargo.toml's is already released, from the Conventional
# Commits since its tag by default (and commits the bump to main), creates the GitHub release with
# scripts/release.sh, then runs CI on the new tag to push the Docker image and waits for it.
# See docs/repository-setup.md#releasing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump when Cargo.toml's version is already released (auto = from commit types)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Exact version to release instead (e.g. 1.2.0 or 1.3.0-rc.1); overrides bump
        type: string
        required: false
      dry_run:
        description: Dry run (only compute the version and show the changes, push nothing)
        type: boolean
        default: false

permissions:
  contents: write # push the bump to main, create the tag and the release
  actions: write # dispatch CI on the tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, release and publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump }}
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main; run this workflow on main (got $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags, for the auto bump

      - name: Check CI passed on this commit
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq length)
          if [ "$passed" != 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA; wait for it, or run CI on main, then retry"
            exit 1
          fi

      - name: Compute version
        id: version
        run: |
          current=$(scripts/bump-version.sh)
          if [ -n "$VERSION" ]; then
            target=$VERSION
          elif git ls-remote --exit-code --tags origin "refs/tags/v$current" >/dev/null; then
            echo "v$current is already released, applying a $BUMP bump"
            target=$BUMP
          else
            echo "v$current is not released yet, releasing it as is"
            target=$current
          fi
          new=$(scripts/bump-version.sh "$target")
          echo "Version: $current -> $new"
          git diff
          echo "version=$new" >>"$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "bumped=false" >>"$GITHUB_OUTPUT"
          else
            echo "bumped=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Commit and push the bump to main
        if: steps.version.outputs.bumped == 'true' && inputs.dry_run == false
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "chore(release): bump version to $NEW_VERSION" Cargo.toml Cargo.lock
          git push origin main

      # In a dry run with a bump the tree is dirty and nothing was pushed, so release.sh's checks
      # can't run; without a bump they run as --dry-run.
      - name: Create the release
        if: inputs.dry_run == false || steps.version.outputs.bumped == 'false'
        run: |
          if [ "$DRY_RUN" = true ]; then
            scripts/release.sh --dry-run
          else
            scripts/release.sh --yes
          fi

      # A release created with GITHUB_TOKEN doesn't trigger ci.yml's `release` event, so run CI
      # on the tag with publish=true (workflow_dispatch is the exception that does run).
      - name: Publish the Docker image
        if: inputs.dry_run == false
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh workflow run ci.yml --ref "$TAG" -f publish=true
          run_id=
          for _ in $(seq 30); do
            sleep 5
            run_id=$(gh run list --workflow ci.yml --event workflow_dispatch --branch "$TAG" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::CI run for $TAG not found; check the Actions tab, or run CI on $TAG with publish"
            exit 1
          fi
          url=$(gh run view "$run_id" --json url --jq .url)
          echo "Publishing in $url"
          {
            echo "### Released $TAG"
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- Docker image: $url"
          } >>"$GITHUB_STEP_SUMMARY"
          gh run watch "$run_id" --exit-status --compact --interval 30
